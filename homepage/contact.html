<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ | ASTRO Market</title>
<meta name="description" content="ASTRO Marketへのお問い合わせはこちらから。">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231d4ed8'/%3E%3Ctext x='32' y='43' font-size='30' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">ASTRO<span>Market</span></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="nav">
      <a href="services.html">事業内容</a>
      <a href="about.html">代表者情報</a>
      <a href="news.html">お知らせ</a>
      <a href="contact.html">お問い合わせ</a>
    </nav>
  </div>
</header>

<main>

  <section class="page-header">
    <div class="container">
      <div class="page-illustration reveal" aria-hidden="true">
        <svg viewBox="0 0 160 160" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="80" cy="80" r="72" fill="#eef4ff" stroke="none"/>
          <rect x="34" y="56" width="92" height="62" rx="6" fill="#ffffff"/>
          <path d="M34 62l46 34 46-34"/>
        </svg>
      </div>
      <h1 class="reveal">お問い合わせ</h1>
      <p class="reveal">サービス内容やお取引に関するご相談は、下記よりお気軽にお問い合わせください。</p>
    </div>
  </section>

  <section class="contact">
    <div class="container contact-inner">
      <form class="contact-form reveal" id="contact-form" novalidate>
        <input type="hidden" name="access_key" value="ad08e178-a893-4480-ac95-9ec410ad79b6">
        <input type="hidden" name="subject" value="ASTRO Market お問い合わせ">
        <input type="checkbox" name="botcheck" class="form-honeypot" tabindex="-1" autocomplete="off">

        <div class="form-row">
          <label for="form-name">お名前<span class="form-required">必須</span></label>
          <input type="text" id="form-name" name="name" autocomplete="name" required>
        </div>

        <div class="form-row">
          <label for="form-email">メールアドレス<span class="form-required">必須</span></label>
          <input type="email" id="form-email" name="email" autocomplete="email" required>
        </div>

        <div class="form-row">
          <label for="form-company">会社名・屋号(任意)</label>
          <input type="text" id="form-company" name="company" autocomplete="organization">
        </div>

        <div class="form-row">
          <label for="form-message">お問い合わせ内容<span class="form-required">必須</span></label>
          <textarea id="form-message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn form-submit">送信する</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="contact-or reveal">または、メールで直接お問い合わせください。</p>
      <div class="contact-links reveal">
        <a class="btn btn-outline" href="mailto:naoto.takahashi@astro-market.jp">naoto.takahashi@astro-market.jp へメールする</a>
      </div>
      <p class="privacy-note reveal">お問い合わせの際にいただいた個人情報は、お問い合わせへの対応以外の目的では使用いたしません。</p>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="copyright-year">2026</span> ASTRO Market. All rights reserved.</p>
  </div>
</footer>

<button id="to-top" class="to-top" aria-label="ページの先頭に戻る">↑</button>

<script src="assets/script.js" defer></script>
</body>
</html>
